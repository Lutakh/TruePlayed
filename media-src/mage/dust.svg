<svg xmlns="http://www.w3.org/2000/svg" width="32" height="16" viewBox="0 0 32 16">
  <!-- Mage arcane dust over the rested part (tiled horizontally): two white sparkles with a
       solid core and a soft edge per 32 px. Tinted by a fading gradient. -->
