<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16">
  <!-- Mage crystal lattice on the fill, seamless 16 x 16 tile: two families of white lines at
       about +-63 deg (period 7.2 px), the second one fainter. Tinted white at low alpha. -->
  <g stroke="#ffffff" stroke-width="1.3" fill="none">
    <path d="M-8 0 L0 16 M0 0 L8 16 M8 0 L16 16 M16 0 L24 16"/>
    <path stroke-opacity="0.7" d="M0 0 L-8 16 M8 0 L0 16 M16 0 L8 16 M24 0 L16 16"/>
  </g>
</svg>
