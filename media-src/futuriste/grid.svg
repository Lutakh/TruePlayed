<?xml version="1.0" encoding="UTF-8"?>
<!-- futuriste/grid (32 x 32, grey): HUD grid, 1 px lines on row 0 and column 0, tiled HV.
     The last row and column are transparent. -->
<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <rect x="0" y="0" width="31" height="1" fill="#ffffff"/>
  <rect x="0" y="1" width="1" height="30" fill="#ffffff"/>
</svg>
