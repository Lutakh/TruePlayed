<?xml version="1.0" encoding="UTF-8"?>
<!-- futuriste/track_frame (32 x 32, baked colours): the track frame, drawn 1 px outside the
     track (texel 1 = the track edge). 3 px ink outline at 85 % under a 1 px #67e8f9 line at
     85 %, TL and BR corners bevelled 5 px. The ink also fills the corner triangles outside
     the bevel, so the rectangular track and fill do not show past it (the board clips them).
     Right under the cyan line the ink is opaque: the line then looks the same over the fill
     and over the track, and every semi-transparent pixel stays dark ink (straight alpha).
     9-slice with 8-texel corners. -->
<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <g opacity="0.85">
    <polygon points="0,0 6.5,0 0,6.5" fill="#01040b"/>
    <polygon points="32,25.5 32,32 25.5,32" fill="#01040b"/>
    <polygon points="6.2,1.5 30.5,1.5 30.5,25.8 25.8,30.5 1.5,30.5 1.5,6.2"
             fill="none" stroke="#01040b" stroke-width="3"/>
  </g>
  <polygon points="6.2,1.5 30.5,1.5 30.5,25.8 25.8,30.5 1.5,30.5 1.5,6.2"
           fill="none" stroke="#01040b" stroke-width="1.8"/>
  <polygon points="6.2,1.5 30.5,1.5 30.5,25.8 25.8,30.5 1.5,30.5 1.5,6.2"
           fill="none" stroke="#67e8f9" stroke-opacity="0.85" stroke-width="1"/>
</svg>
