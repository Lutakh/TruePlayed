<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!-- Shaman tooltip corner: carved stone bracket along the top and left edges with a stone
       medallion (lightning) on the corner. 1 texel = 1 px; texel (10, 10) = the tooltip's
       outer top-left corner. The bottom-right corner reuses it with flipX + flipY.
       From the Chaman board (72 x 60 units, same scale), top arm shortened to fit. -->
  <path d="M60 10 L18 10 Q10 10 10 18 L10 52" fill="none" stroke="#0a0e14" stroke-width="5.4" stroke-linecap="round"/>
  <path d="M60 10 L18 10 Q10 10 10 18 L10 52" fill="none" stroke="#7c8792" stroke-width="3.4" stroke-linecap="round"/>
  <path d="M56 10 L18 10 Q10 10 10 18 L10 48" fill="none" stroke="#2c343d" stroke-width="1.2" stroke-dasharray="1.6 3.2"/>
  <path d="M57 7 L60 10 L57 13 L54 10 Z" fill="#0070dd" stroke="#0a0e14" stroke-width="1"/>
  <path d="M7 52 L10 55 L13 52 L10 49 Z" fill="#0070dd" stroke="#0a0e14" stroke-width="1"/>
  <circle cx="10" cy="10" r="7.6" fill="#5d6772" stroke="#0a0e14" stroke-width="1.4"/>
  <circle cx="10" cy="10" r="5.6" fill="#1b222b"/>
  <path d="M11.2 4.6 L7.2 10.8 L9.9 10.8 L8.7 15.4 L12.9 8.9 L10.2 8.9 L11.9 4.6 Z" fill="#9fd0ff"/>
  <path d="M5.2 6.2 A6.2 6.2 0 0 1 9.4 3.9" fill="none" stroke="#ffffff" stroke-opacity="0.25" stroke-width="0.8"/>
</svg>
