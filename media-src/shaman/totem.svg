<svg xmlns="http://www.w3.org/2000/svg" width="32" height="64" viewBox="0 0 32 64">
  <!-- Shaman thunderbird totem (left of the bar; the right one is drawn with flipX).
       From the Chaman board (40 x 68 units), scaled 0.94 into the texture. The cross-bar on
       the right reaches the texture's right edge, where it meets the stone frame. -->
