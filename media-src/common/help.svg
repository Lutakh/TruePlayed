<?xml version="1.0" encoding="UTF-8"?>
<!-- common/help (32 x 32, grey): a circled question mark, the help icon after each column
     header of the statistics window (Themes.COMMON_MEDIA.help, Window.lua). White, tinted
     by vertex colour (the theme's ui.dim, ui.accent while hovered). Drawn at 10 x 10 UI
     units, i.e. 14 to 28 screen pixels at a UI scale of 1 (1080p to 4K): the ring (3.6
     texels) and the glyph (3.8 texels) stay at least one screen pixel wide when the
     texture is minified without mipmaps. -->
<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <circle cx="16" cy="16" r="13.9" fill="none" stroke="#ffffff" stroke-width="3.6"/>
  <path d="M11.4 12.3 A4.6 4.6 0 1 1 19.25 15.55 C17.7 16.9 16 17.4 16 19.4 L16 19.6" fill="none"
        stroke="#ffffff" stroke-width="3.8" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="16" cy="24.4" r="2.3" fill="#ffffff"/>
</svg>
