<!doctype html>
<!-- CurseForge project logo, 400 x 400 px: two variants (A: brand violet #8B5CF6, B: neon
     night like the Futuristic theme). Our own drawing (no Blizzard art), fonts from
     Media/Fonts (SIL OFL). Render: node media-src/curseforge/render-logo.js -->
<html><head><meta charset="utf-8">
<style>
@font-face { font-family: "Orbitron"; src: url("../../Media/Fonts/Orbitron-Bold.ttf"); }
@font-face { font-family: "Rajdhani"; src: url("../../Media/Fonts/Rajdhani-SemiBold.ttf"); }
html, body { margin: 0; padding: 0; background: transparent; }
svg { display: block; }
</style></head>
<body>
<!-- Variant A: brand violet -->
<svg id="A" width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="a-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="0.45" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#3b0f86"/>
    </linearGradient>
    <radialGradient id="a-glow" cx="0.5" cy="0.4" r="0.45">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="a-arc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#ff2bd6"/>
    </linearGradient>
    <filter id="a-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#1e0752" flood-opacity="0.55"/>
    </filter>
  </defs>
  <rect width="400" height="400" fill="url(#a-bg)"/>
  <rect width="400" height="400" fill="url(#a-glow)"/>
  <!-- clock: XP ring + face -->
  <g transform="translate(200 158)" filter="url(#a-shadow)">
    <circle r="92" fill="none" stroke="#1e0752" stroke-opacity="0.35" stroke-width="16"/>
    <circle r="92" fill="none" stroke="url(#a-arc)" stroke-width="16" stroke-linecap="round"
            stroke-dasharray="433.5 578" transform="rotate(-90)"/>
    <circle r="72" fill="#ffffff"/>
    <g stroke="#5b21b6" stroke-linecap="round">
      <line x1="0" y1="-60" x2="0" y2="-50" stroke-width="5"/>
      <line x1="60" y1="0" x2="50" y2="0" stroke-width="5"/>
      <line x1="0" y1="60" x2="0" y2="50" stroke-width="5"/>
      <line x1="-60" y1="0" x2="-50" y2="0" stroke-width="5"/>
      <g stroke-width="3" stroke-opacity="0.7">
        <line x1="30" y1="-51.96" x2="27" y2="-46.77"/><line x1="51.96" y1="-30" x2="46.77" y2="-27"/>
        <line x1="51.96" y1="30" x2="46.77" y2="27"/><line x1="30" y1="51.96" x2="27" y2="46.77"/>
        <line x1="-30" y1="51.96" x2="-27" y2="46.77"/><line x1="-51.96" y1="30" x2="-46.77" y2="27"/>
        <line x1="-51.96" y1="-30" x2="-46.77" y2="-27"/><line x1="-30" y1="-51.96" x2="-27" y2="-46.77"/>
      </g>
    </g>
    <!-- hands at 10:10 -->
    <line x1="0" y1="0" x2="-30" y2="-17" stroke="#2e1065" stroke-width="7" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="34" y2="-36" stroke="#2e1065" stroke-width="5" stroke-linecap="round"/>
    <circle r="7" fill="#ff2bd6"/>
    <circle r="3" fill="#ffffff"/>
  </g>
  <!-- wordmark -->
  <text x="200" y="318" text-anchor="middle" font-family="Orbitron" font-size="44" fill="#ffffff"
        filter="url(#a-shadow)" letter-spacing="1">TruePlayed</text>
  <!-- mini XP bar -->
  <g transform="translate(70 340)">
    <rect width="260" height="12" rx="6" fill="#1e0752" fill-opacity="0.45"/>
    <rect width="198" height="12" rx="6" fill="#22d3ee" fill-opacity="0.85"/>
    <rect width="150" height="12" rx="6" fill="#ff2bd6"/>
  </g>
  <!-- FOREVER badge -->
  <g transform="translate(262 18)">
    <rect width="122" height="32" rx="16" fill="#fbbf24"/>
    <text x="61" y="22.5" text-anchor="middle" font-family="Orbitron" font-size="15" fill="#3b0764"
          letter-spacing="2">FOREVER</text>
  </g>
</svg>
<!-- Variant B: neon night -->
<svg id="B" width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="b-bg" cx="0.5" cy="0.38" r="0.75">
      <stop offset="0" stop-color="#1b1747"/>
      <stop offset="0.6" stop-color="#0b1026"/>
      <stop offset="1" stop-color="#03050d"/>
    </radialGradient>
    <pattern id="b-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#22d3ee" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <linearGradient id="b-arc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#ff2bd6"/>
    </linearGradient>
    <filter id="b-neon" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="b-blur" x="-20%" y="-60%" width="140%" height="220%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <filter id="b-soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="400" height="400" fill="url(#b-bg)"/>
  <rect width="400" height="400" fill="url(#b-grid)"/>
  <g transform="translate(200 158)">
    <circle r="92" fill="none" stroke="#a5f3fc" stroke-opacity="0.12" stroke-width="14"/>
    <circle r="92" fill="none" stroke="url(#b-arc)" stroke-width="14" stroke-linecap="round"
            stroke-dasharray="433.5 578" transform="rotate(-90)" filter="url(#b-neon)"/>
    <circle r="70" fill="#060c1a" stroke="#22d3ee" stroke-opacity="0.6" stroke-width="2"/>
    <g stroke="#67e8f9" stroke-linecap="round" filter="url(#b-soft)">
      <line x1="0" y1="-58" x2="0" y2="-48" stroke-width="4"/>
      <line x1="58" y1="0" x2="48" y2="0" stroke-width="4"/>
      <line x1="0" y1="58" x2="0" y2="48" stroke-width="4"/>
      <line x1="-58" y1="0" x2="-48" y2="0" stroke-width="4"/>
    </g>
    <g filter="url(#b-soft)" stroke-linecap="round">
      <line x1="0" y1="0" x2="-29" y2="-16" stroke="#e6f7ff" stroke-width="6"/>
      <line x1="0" y1="0" x2="32" y2="-34" stroke="#e6f7ff" stroke-width="4"/>
    </g>
    <circle r="6" fill="#ff2bd6" filter="url(#b-soft)"/>
  </g>
  <text x="200" y="318" text-anchor="middle" font-family="Orbitron" font-size="44" fill="#22d3ee"
        letter-spacing="1" opacity="0.55" filter="url(#b-blur)">TruePlayed</text>
  <text x="200" y="318" text-anchor="middle" font-family="Orbitron" font-size="44" fill="#f0fbff"
        letter-spacing="1">TruePlayed</text>
  <g transform="translate(70 340)">
    <rect width="260" height="10" rx="5" fill="#a5f3fc" fill-opacity="0.12"/>
    <rect width="198" height="10" rx="5" fill="#22d3ee" fill-opacity="0.75"/>
    <rect width="150" height="10" rx="5" fill="#ff2bd6" filter="url(#b-soft)"/>
  </g>
  <g transform="translate(262 18)">
    <rect width="122" height="32" rx="16" fill="none" stroke="#fbbf24" stroke-width="2"/>
    <text x="61" y="22.5" text-anchor="middle" font-family="Orbitron" font-size="15" fill="#fbbf24"
          letter-spacing="2">FOREVER</text>
  </g>
</svg>
</body></html>
