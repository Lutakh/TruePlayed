<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <!-- Druid tooltip frame: carved wood board (9-slice, 10-texel corners drawn at 10 px, outer radius 9).
       Row/column 0 = ink outline, 1..3 = visible wood band (the inner panel covers from 4 inward).
       Grain stripes (board 9 px period) in the top and bottom pieces, plain sides; light from above,
       shadow below, inset highlight on row 1. Baked colours. -->
  <defs>
    <clipPath id="rim"><rect x="1" y="1" width="30" height="30" rx="8"/></clipPath>
    <linearGradient id="lit" x1="0" y1="1" x2="0" y2="15" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffdeb0" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ffdeb0" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="shade" x1="0" y1="17" x2="0" y2="31" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.35"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="32" height="32" rx="9" fill="#1a1008"/>
  <g clip-path="url(#rim)">
    <rect x="0" y="0" width="32" height="32" fill="#5a4029"/>
    <rect x="0" y="3" width="32" height="1" fill="#4a3320"/>
    <rect x="0" y="4" width="32" height="2" fill="#684b31"/>
    <rect x="0" y="6" width="32" height="2" fill="#553b25"/>
    <rect x="0" y="8" width="32" height="2" fill="#5f432b"/>
    <rect x="0" y="22" width="32" height="2" fill="#553b25"/>
    <rect x="0" y="24" width="32" height="2" fill="#5f432b"/>
    <rect x="0" y="28" width="32" height="1" fill="#4a3320"/>
    <rect x="0" y="29" width="32" height="2" fill="#684b31"/>
    <rect x="0" y="1" width="32" height="14" fill="url(#lit)"/>
    <rect x="0" y="17" width="32" height="14" fill="url(#shade)"/>
    <rect x="0" y="1" width="32" height="1" fill="#ffdeb0" fill-opacity="0.28"/>
  </g>
</svg>
