<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <!-- Inner shadow for the tooltip inner panel (board "inset 0 0 18px"): opaque at the edge, fading
       to nothing 14 texels in; corners clipped to radius 5. 9-slice with 14-texel corners drawn at
       16 px, tinted black. White, grey = true. -->
  <defs>
    <clipPath id="clip"><rect x="0" y="0" width="32" height="32" rx="5"/></clipPath>
    <linearGradient id="gl" x1="0" y1="0" x2="14" y2="0" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#ffffff" stop-opacity="1"/><stop offset="0.25" stop-color="#ffffff" stop-opacity="0.56"/><stop offset="0.5" stop-color="#ffffff" stop-opacity="0.25"/><stop offset="0.75" stop-color="#ffffff" stop-opacity="0.06"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></linearGradient>
    <linearGradient id="gr" x1="32" y1="0" x2="18" y2="0" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#ffffff" stop-opacity="1"/><stop offset="0.25" stop-color="#ffffff" stop-opacity="0.56"/><stop offset="0.5" stop-color="#ffffff" stop-opacity="0.25"/><stop offset="0.75" stop-color="#ffffff" stop-opacity="0.06"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></linearGradient>
    <linearGradient id="gt" x1="0" y1="0" x2="0" y2="14" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#ffffff" stop-opacity="1"/><stop offset="0.25" stop-color="#ffffff" stop-opacity="0.56"/><stop offset="0.5" stop-color="#ffffff" stop-opacity="0.25"/><stop offset="0.75" stop-color="#ffffff" stop-opacity="0.06"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></linearGradient>
    <linearGradient id="gb" x1="0" y1="32" x2="0" y2="18" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#ffffff" stop-opacity="1"/><stop offset="0.25" stop-color="#ffffff" stop-opacity="0.56"/><stop offset="0.5" stop-color="#ffffff" stop-opacity="0.25"/><stop offset="0.75" stop-color="#ffffff" stop-opacity="0.06"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></linearGradient>
  </defs>
  <g clip-path="url(#clip)">
    <rect x="0" y="0" width="14" height="32" fill="url(#gl)"/>
    <rect x="18" y="0" width="14" height="32" fill="url(#gr)"/>
    <rect x="0" y="0" width="32" height="14" fill="url(#gt)"/>
    <rect x="0" y="18" width="32" height="14" fill="url(#gb)"/>
  </g>
</svg>
