<svg xmlns="http://www.w3.org/2000/svg" width="32" height="8" viewBox="0 0 32 8">
  <!-- Druid rested part: two soft moon-mist wisps (board radial ellipses at 22 %/35 % and 58 %/70 %),
       stretched over the rested span. White, grey = true; the second wisp is weaker (board .30 vs .45). -->
  <defs>
    <radialGradient id="w">
      <stop offset="0" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="0.7" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="0" y="0" width="32" height="8" fill="#ffffff" fill-opacity="0.004"/>
  <ellipse cx="7" cy="2.8" rx="9.5" ry="2.4" fill="url(#w)"/>
  <ellipse cx="18.6" cy="5.6" rx="11.4" ry="2" fill="url(#w)" opacity="0.67"/>
</svg>
