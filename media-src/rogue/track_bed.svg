<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 8 8">
  <!-- Rogue track bed (Voleur board, "piste"), baked, 9-slice: corners 6 texels = 3 px
       (1 user unit = 1 px, 2 texels). Corner radius 2 px, inner shadow on the top rows,
       1 px dark inner ring; rows / columns 3..5 stretch (flat #141018). -->
  <defs><clipPath id="c"><rect x="0" y="0" width="8" height="8" rx="2"/></clipPath></defs>
  <g clip-path="url(#c)">
    <rect x="0" y="0" width="8" height="8" fill="#141018"/>
    <rect x="0" y="0" width="8" height="1" fill="#040305"/>
    <rect x="0" y="1" width="8" height="1" fill="#08060a"/>
    <rect x="0" y="2" width="8" height="1" fill="#0e0b12"/>
    <rect x="0" y="5" width="8" height="1" fill="#110d15"/>
    <rect x="0" y="6" width="8" height="1" fill="#0b090e"/>
    <rect x="0" y="7" width="8" height="1" fill="#060508"/>
    <rect x="0" y="0" width="1" height="8" fill="#000000" fill-opacity="0.45"/>
    <rect x="7" y="0" width="1" height="8" fill="#000000" fill-opacity="0.45"/>
  </g>
</svg>
