<svg xmlns="http://www.w3.org/2000/svg" width="32" height="16" viewBox="0 0 32 16">
  <!-- Fel glow at a track end (grey, tinted): half ellipse centred on the left edge. -->
  <defs>
    <radialGradient id="g" gradientUnits="userSpaceOnUse" cx="0" cy="8" r="32"
                    gradientTransform="translate(0 8) scale(1 0.45) translate(0 -8)">
      <stop offset="0" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="0" y="0" width="32" height="16" fill="url(#g)"/>
</svg>
