<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <!-- Tooltip frame (grey, tinted; 9-slice 15 texels -> 15 px): 1 px outline, 4 px iron
       band shaded top to bottom inside the texture (lit top row, flat middle rows that
       stretch along the sides, dark bottom), the inner panel's 1 px ink border and its
       inner shadow; open centre (the 2 x 2 middle texels are fully transparent). The ink parts
       are a near-black grey (#222): times the frame tint they give the board's ink #0c0a12. -->
  <defs>
    <linearGradient id="iron" x1="0" y1="0" x2="0" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0.031" stop-color="#ffffff"/><stop offset="0.07" stop-color="#ebebeb"/>
      <stop offset="0.15" stop-color="#e0e0e0"/><stop offset="0.47" stop-color="#b8b8b8"/>
      <stop offset="0.53" stop-color="#b8b8b8"/><stop offset="0.84" stop-color="#8a8a8a"/>
      <stop offset="0.9" stop-color="#6e6e6e"/><stop offset="0.97" stop-color="#4a4a4a"/>
    </linearGradient>
    <clipPath id="inner"><path clip-rule="evenodd"
      d="M8 5 A3 3 0 0 0 5 8 V24 A3 3 0 0 0 8 27 H24 A3 3 0 0 0 27 24 V8 A3 3 0 0 0 24 5 Z M14 14 V18 H18 V14 Z"/></clipPath>
    <filter id="blur" x="0" y="0" width="1" height="1"><feGaussianBlur stdDeviation="2.2"/></filter>
  </defs>
  <path fill-rule="evenodd" fill="#222222"
        d="M7 0 H25 A7 7 0 0 1 32 7 V25 A7 7 0 0 1 25 32 H7 A7 7 0 0 1 0 25 V7 A7 7 0 0 1 7 0 Z
           M8 5 A3 3 0 0 0 5 8 V24 A3 3 0 0 0 8 27 H24 A3 3 0 0 0 27 24 V8 A3 3 0 0 0 24 5 Z"/>
  <path fill-rule="evenodd" fill="url(#iron)"
        d="M7 1 H25 A6 6 0 0 1 31 7 V25 A6 6 0 0 1 25 31 H7 A6 6 0 0 1 1 25 V7 A6 6 0 0 1 7 1 Z
           M8 5 A3 3 0 0 0 5 8 V24 A3 3 0 0 0 8 27 H24 A3 3 0 0 0 27 24 V8 A3 3 0 0 0 24 5 Z"/>
  <g clip-path="url(#inner)">
    <path fill-rule="evenodd" fill="#2a2a2a" fill-opacity="0.62" filter="url(#blur)"
          d="M0 0 H32 V32 H0 Z M8 8 V24 H24 V8 Z"/>
    <rect x="5.5" y="5.5" width="21" height="21" rx="2.5" fill="none" stroke="#222222" stroke-width="1"/>
  </g>
</svg>
