      <stop offset="0" stop-color="#b3b4f7"/><stop offset="0.6" stop-color="#8788ee"/>
      <stop offset="1" stop-color="#6a6bd0"/>
    </linearGradient>
  </defs>
  <path d="M2.5 23 H13.5 V28.5 Q13.5 31.5 10.5 31.5 H5.5 Q2.5 31.5 2.5 28.5 Z" fill="#0c0a12"/>
  <path d="M2.5 22.5 H13.5 V23 H12.5 V28.3 Q12.5 30.5 10.3 30.5 H5.7 Q3.5 30.5 3.5 28.3 V23 H2.5 Z" fill="url(#t)"/>
