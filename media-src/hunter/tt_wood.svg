<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <!-- Hunter tooltip frame: light oak board (9-slice, 10-texel corners drawn at 10 px, outer radius 9).
       Row/column 0 = ink outline, 1..4 = visible wood band (the inner panel covers from 5 inward).
       Grain stripes (board 10 px period) in the top and bottom pieces, plain sides; light from above,
       shadow below, inset highlight on row 1. Baked colours. -->
  <defs>
    <clipPath id="rim"><rect x="1" y="1" width="30" height="30" rx="8"/></clipPath>
    <linearGradient id="lit" x1="0" y1="1" x2="0" y2="15" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffe2b4" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#ffe2b4" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="shade" x1="0" y1="17" x2="0" y2="31" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.35"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="32" height="32" rx="9" fill="#1a1008"/>
  <g clip-path="url(#rim)">
    <rect x="0" y="0" width="32" height="32" fill="#8f5e33"/>
    <rect x="0" y="1" width="32" height="2" fill="#976538"/>
    <rect x="0" y="3" width="32" height="1" fill="#7f5129"/>
    <rect x="0" y="4" width="32" height="2" fill="#a3703f"/>
    <rect x="0" y="6" width="32" height="2" fill="#8a5a2f"/>
    <rect x="0" y="8" width="32" height="2" fill="#9a6839"/>
    <rect x="0" y="22" width="32" height="2" fill="#a3703f"/>
    <rect x="0" y="24" width="32" height="2" fill="#8a5a2f"/>
    <rect x="0" y="26" width="32" height="2" fill="#9a6839"/>
    <rect x="0" y="28" width="32" height="2" fill="#976538"/>
    <rect x="0" y="30" width="32" height="1" fill="#7f5129"/>
    <rect x="0" y="1" width="32" height="14" fill="url(#lit)"/>
    <rect x="0" y="17" width="32" height="14" fill="url(#shade)"/>
    <rect x="0" y="1" width="32" height="1" fill="#ffe2b4" fill-opacity="0.3"/>
  </g>
</svg>
