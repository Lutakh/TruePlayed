<svg xmlns="http://www.w3.org/2000/svg" width="32" height="8" viewBox="0 0 32 8">
  <!-- Hunter rested part: one soft wisp of morning mist (board radial ellipse at 30 % / 30 %),
       stretched over the rested span. White, grey = true. -->
  <defs>
    <radialGradient id="w">
      <stop offset="0" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="0.7" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="0" y="0" width="32" height="8" fill="#ffffff" fill-opacity="0.004"/>
  <ellipse cx="9.6" cy="2.4" rx="10.4" ry="2.2" fill="url(#w)"/>
</svg>
