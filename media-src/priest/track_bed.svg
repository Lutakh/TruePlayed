<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 8 8">
  <!-- Priest track bed (Pretre board, "piste"), baked, 9-slice: corners 6 texels = 3 px
       (1 user unit = 1 px, 2 texels). Corner radius 3 px, inner shadow on the top rows,
       dark inner ring; rows / columns 3..5 stretch (flat #18132a). -->
  <defs><clipPath id="c"><rect x="0" y="0" width="8" height="8" rx="3"/></clipPath></defs>
  <g clip-path="url(#c)">
    <rect x="0" y="0" width="8" height="8" fill="#18132a"/>
    <rect x="0" y="0" width="8" height="1" fill="#050409"/>
    <rect x="0" y="1" width="8" height="1" fill="#09070f"/>
    <rect x="0" y="2" width="8" height="1" fill="#100c1b"/>
    <rect x="0" y="5" width="8" height="1" fill="#141022"/>
    <rect x="0" y="6" width="8" height="1" fill="#0e0b17"/>
    <rect x="0" y="7" width="8" height="1" fill="#07060c"/>
    <rect x="0" y="0" width="1" height="8" fill="#000000" fill-opacity="0.45"/>
    <rect x="7" y="0" width="1" height="8" fill="#000000" fill-opacity="0.45"/>
  </g>
</svg>
