<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 16 16">
  <!-- Priest end-of-fill needle (Pretre board: 2 px white marker + the "%" tab under it),
       baked, drawn as a 9-slice 12 px wide: corners 12 texels = 6 px (1 user unit = 1 px).
       The centre column (x 6..10) is never drawn: the needle is x 5..6 + 10..11, the tab
       x 1..6 + 10..15 (10 px). Rows 10..16 hold the tab hanging under the frame. -->
  <defs>
    <linearGradient id="tab" gradientUnits="userSpaceOnUse" x1="0" y1="10" x2="0" y2="15.6">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#eeeaf4"/>
      <stop offset="1" stop-color="#c4bdd6"/>
    </linearGradient>
  </defs>
  <rect x="5" y="0" width="1" height="11" fill="#ffffff"/>
  <rect x="10" y="0" width="1" height="11" fill="#ffffff"/>
  <path d="M0.5 10 H15.5 V12.6 A3 3 0 0 1 12.5 15.6 H3.5 A3 3 0 0 1 0.5 12.6 Z" fill="#16121f"/>
  <path d="M1.5 10 H14.5 V12.6 A2 2 0 0 1 12.5 14.6 H3.5 A2 2 0 0 1 1.5 12.6 Z" fill="url(#tab)"/>
</svg>
