<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <!-- Priest "halo of light" (Pretre board, left of the bar), baked, redrawn for its size
       (29 px): soft light, three long rays (none towards the bar) and four short ones in
       ivory with thin dark outlines, an ivory ring lined with gold, a white core. -->
  <circle cx="16" cy="16" r="11.6" fill="#fff6d8" opacity="0.24"/>
  <g transform="translate(16 16)" fill="#fffaee" stroke="#16121f" stroke-width="0.7" stroke-linejoin="round" paint-order="stroke">
    <path d="M-2.1 -8.4 L0 -15.5 L2.1 -8.4 Z"/>
    <path d="M-2.1 -8.4 L0 -15.5 L2.1 -8.4 Z" transform="rotate(180)"/>
    <path d="M-2.1 -8.4 L0 -15.5 L2.1 -8.4 Z" transform="rotate(270)"/>
    <path d="M-1.7 -8.4 L0 -13.2 L1.7 -8.4 Z" transform="rotate(45)"/>
    <path d="M-1.7 -8.4 L0 -13.2 L1.7 -8.4 Z" transform="rotate(135)"/>
    <path d="M-1.7 -8.4 L0 -13.2 L1.7 -8.4 Z" transform="rotate(225)"/>
    <path d="M-1.7 -8.4 L0 -13.2 L1.7 -8.4 Z" transform="rotate(315)"/>
  </g>
  <circle cx="16" cy="16" r="8" fill="none" stroke="#16121f" stroke-width="3.4"/>
  <circle cx="16" cy="16" r="8" fill="none" stroke="#f3ecd9" stroke-width="1.9"/>
  <circle cx="16" cy="16" r="8" fill="none" stroke="#e8c872" stroke-width="0.9"/>
  <circle cx="16" cy="16" r="5.6" fill="#ffffff" opacity="0.24"/>
  <circle cx="16" cy="16" r="3.3" fill="#ffffff" stroke="#16121f" stroke-width="1"/>
</svg>
