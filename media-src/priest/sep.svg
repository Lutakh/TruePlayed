<svg xmlns="http://www.w3.org/2000/svg" width="64" height="2" viewBox="0 0 64 2">
  <!-- Priest tooltip separator (Pretre board, "lumiere / ombre"), baked, stretched over
       the inner width: white fading in up to the middle, lavender #b8a1ff fading out. -->
  <defs>
    <linearGradient id="l" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="32" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="r" gradientUnits="userSpaceOnUse" x1="32" y1="0" x2="64" y2="0">
      <stop offset="0" stop-color="#b8a1ff" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#b8a1ff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="32" height="2" fill="url(#l)"/>
  <rect x="32" y="0" width="32" height="2" fill="url(#r)"/>
</svg>
