<svg xmlns="http://www.w3.org/2000/svg" width="8" height="8" viewBox="0 0 8 8" shape-rendering="crispEdges">
  <!-- Fill grain: "/" diagonal stripes, 3 texels on / 5 off, period 8 (tiled HV, white, tinted by alpha). -->
  <g fill="#ffffff">
    <rect x="0" y="0" width="3" height="1"/>
    <rect x="7" y="1" width="1" height="1"/><rect x="0" y="1" width="2" height="1"/>
    <rect x="6" y="2" width="2" height="1"/><rect x="0" y="2" width="1" height="1"/>
    <rect x="5" y="3" width="3" height="1"/>
    <rect x="4" y="4" width="3" height="1"/>
    <rect x="3" y="5" width="3" height="1"/>
    <rect x="2" y="6" width="3" height="1"/>
    <rect x="1" y="7" width="3" height="1"/>
  </g>
</svg>
