<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <!-- Golden halo around the end-of-fill marker (board: radial .6 -> .28 at 35 % -> 0 at 72 %),
       normalised to full white at the centre; tinted and scaled by the layer colour (additive). -->
  <defs>
    <radialGradient id="h" cx="16" cy="16" r="16" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="0.486" stop-color="#ffffff" stop-opacity="0.47"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="0" y="0" width="32" height="32" fill="url(#h)"/>
</svg>
