name: Package preview

# Builds the addon zip exactly as the release does (BigWigs packager, same .pkgmeta) but
# uploads nothing: the zip is kept as a downloadable artifact of the run, to install in the
# game before tagging a release (docs/PUBLISHING-fr.md, step 9). Started by hand only
# (Actions > Package preview > Run workflow, on any branch).
on:
  workflow_dispatch:
  push:                                  # TEMPORARY: validation run, removed in the next commit
    branches: ['claude/loving-curie-g0yajy']

permissions:
  contents: read

jobs:
  test:
    # The same tests, checks and luacheck as every push (see ci.yml).
    uses: ./.github/workflows/ci.yml

  package:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The release writes RELEASE_NOTES.md (the tagged version's section of CHANGELOG.md);
      # without that file the packager would replace CHANGELOG.md in the zip by the commit
      # log. Nothing is uploaded here, so the whole CHANGELOG.md serves.
      - name: Release notes stand-in
        run: cp CHANGELOG.md RELEASE_NOTES.md

      - uses: BigWigsMods/packager@v2
        with:
          args: -d

      # The packager writes the zip into .release/, a hidden folder: upload-artifact skips
      # hidden files unless told otherwise.
      - uses: actions/upload-artifact@v7
        with:
          path: .release/*.zip
          include-hidden-files: true
          archive: false
          if-no-files-found: error
          retention-days: 14
